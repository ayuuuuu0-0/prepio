slug: stacks-and-queues
title: "Stacks and Queues"
node: stacks-and-queues
kind: lesson
status: published
difficulty: medium
est_minutes: 5
skills:
  - { skill: stacks, weight: 0.5 }
  - { skill: queues, weight: 0.5 }
summary:
  - "A stack returns the newest item first (LIFO), which fits undo, nested brackets, and backtracking."
  - "A queue returns the oldest item first (FIFO), which fits job processing and breadth-first search."
  - "In Python, use collections.deque for a queue, because list.pop(0) shifts every remaining element."
steps:
  - id: intro
    type: intro
    beats:
      - { text: "A stack hands back the newest item first: last in, first out.", emphasis: "last in, first out", visual: bars, durationMs: 4500 }
      - { text: "A queue serves the oldest item first: first in, first out.", emphasis: "first in, first out", visual: flow, durationMs: 4500 }
      - { text: "Undo and parsing want a stack; job processing and breadth-first search want a queue.", emphasis: "want a queue", visual: pulse, durationMs: 5500 }
  - id: undo-history
    type: mcq
    prompt: "An editor's undo button must reverse the most recent change first, then the one before it. Which structure should hold the change history?"
    options:
      - "A queue"
      - "A hash map keyed by change ID"
      - "A set of changes"
      - "A stack"
    answer: 3
    explanations:
      correct: "Undo always needs the newest change. Pushing each change and popping on undo gives exactly that, in O(1) per operation."
      wrong:
        0: "A queue returns the oldest change first, so undo would reverse the first edit of the session instead of the latest."
        1: "A hash map finds a change by ID quickly but keeps no notion of which change came last."
        2: "A set has no order at all, so it cannot tell you which change to undo next."
  - id: bracket-check
    type: arrange
    prompt: "Order the steps for checking that the brackets in a config string are balanced."
    items:
      - "At the end, report balanced only if the stack is empty"
      - "On an opening bracket, push it onto the stack"
      - "Scan the characters from left to right"
      - "On a closing bracket, pop and check that it matches; fail if the stack is empty or it does not match"
    order: [2, 1, 3, 0]
    explanation: "Scan left to right, push openers, pop and match on closers, and finish with an empty stack. A stack fits because the most recently opened bracket must close first."
  - id: deque-front
    type: true_false
    statement: "In Python, collections.deque removes from the front in O(1), while list.pop(0) takes O(n)."
    answer: true
    explanation: "A list stores elements contiguously, so removing the first one shifts all the rest. A deque is built for cheap removal at both ends, which is what a queue needs."
  - id: swap-the-queue
    type: mcq
    prompt: "A traversal keeps discovered nodes in a queue and always takes the next node from it, so it visits nodes level by level. What changes if you swap the queue for a stack?"
    options:
      - "It still visits level by level, only faster because stack pops are cheaper"
      - "It follows one branch deep before backing up, like depth-first search"
      - "It stops after visiting the first level"
    answer: 1
    explanations:
      correct: "A stack hands back the most recently discovered node, so the walk keeps diving into the newest branch. The container alone decides breadth-first versus depth-first order."
      wrong:
        0: "Level order comes from taking the oldest node first. A stack takes the newest, so the order changes; push and pop are O(1) either way."
        2: "The walk still runs until the container is empty; only the order of visits changes."
