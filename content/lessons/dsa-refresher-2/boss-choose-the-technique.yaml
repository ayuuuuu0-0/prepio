summary:
  - "Know the costs of strings and linked lists: count characters instead of sorting, and use fast and slow pointers instead of indexing."
  - "Reach for a heap whenever you repeatedly need the smallest or largest item, as in merging sorted streams or keeping the top k."
  - "Greedy is right only when each choice is provably safe, as with 1, 5, 10, 25 coins; otherwise a DP table over subproblems gives the exact answer."
steps:
  - id: intro
    type: intro
    beats:
      - { text: "Boss time: seven problems, five techniques from this world.", emphasis: "seven problems", visual: bars, durationMs: 4500 }
      - { text: "Strings, links, heaps, greedy choices, and tables all come back.", emphasis: "all come back", visual: flow, durationMs: 5000 }
      - { text: "Ask what the problem repeats, ranks, or rewires; that names the tool.", emphasis: "names the tool", visual: pulse, durationMs: 5000 }
  - id: merge-logs
    type: mcq
    prompt: "A service merges 50 sorted log files into one sorted stream. What lets it pick the next line quickly?"
    options:
      - "Concatenate all the files and sort the result"
      - "Scan the head of every file for the smallest each time"
      - "A min-heap holding the current head line of each file"
    answer: 2
    explanations:
      correct: "The heap's top is the smallest current line. Pop it, push the next line from the same file, and each output line costs O(log k) for k files."
      wrong:
        0: "Sorting everything ignores that each file is already sorted, costs O(N log N), and needs every line in memory at once."
        1: "Scanning all 50 heads gives the right order, but it costs O(k) per line; a heap cuts that to O(log k)."
  - id: anagram-counts
    type: true_false
    statement: "Two strings are anagrams exactly when their character counts match, so a 26-entry count array checks two lowercase words in O(n) time."
    answer: true
    explanation: "Anagrams are rearrangements, which is the same as having equal counts for every letter. Filling the counts is one pass per word, and comparing 26 entries is constant work."
  - id: list-middle
    type: mcq
    prompt: "You need the middle node of a singly linked list in one pass, without knowing its length. What works?"
    options:
      - "Index straight to position n // 2, as with an array"
      - "Slow and fast pointers: when fast reaches the end, slow is at the middle"
      - "Reverse the list, then walk half of it from the new head"
    answer: 1
    explanations:
      correct: "Fast moves two steps for every one step of slow, so when fast runs out, slow has covered half the list: one pass and O(1) extra space."
      wrong:
        0: "A linked list has no index: reaching position n // 2 means walking from the head, and you don't know n without another full pass."
        2: "Reversing costs a full pass, and walking half of the reversed list still needs the length, which takes another pass to learn."
  - id: top-k-steps
    type: arrange
    prompt: "Order the steps to keep the k largest values of a stream with a min-heap."
    items:
      - "If the heap now holds more than k values, pop its smallest"
      - "When the stream ends, the heap holds the k largest values"
      - "Start with an empty min-heap"
      - "Push the next incoming value onto the heap"
    order: [2, 3, 0, 1]
    explanation: "Each value is pushed, and the heap is trimmed back to k by popping its smallest. What survives is the k largest, for O(n log k) time and O(k) memory."
  - id: cashier-coins
    type: mcq
    prompt: "Coins are 1, 5, 10, and 25. A cashier gives change by always taking the largest coin that fits. What is true for this coin system?"
    options:
      - "It always uses the fewest coins for this coin system"
      - "It can be wrong, because greedy is never optimal for coin change"
      - "It is optimal only when the amount is a multiple of 5"
    answer: 0
    explanations:
      correct: "For 1, 5, 10, 25, greedy gives the fewest coins for every amount. That is a property of this coin system, not of greedy in general: with 1, 3, 4 it fails for 6."
      wrong:
        1: "Greedy is optimal for some coin systems, including this one. DP is needed for systems like 1, 3, 4, where greedy can fail."
        2: "Multiples of 5 are not special: greedy is optimal for every amount with these coins, such as 7 = 5 + 1 + 1."
  - id: cache-merge-sort
    type: true_false
    statement: "Adding a memo cache to merge sort makes it asymptotically faster, just as it does for recursive Fibonacci."
    answer: false
    explanation: "Memoization helps only when subproblems overlap. Merge sort's halves are distinct, so the cache never gets a hit and only adds memory; it stays O(n log n)."
  - id: fewest-coins
    type: mcq
    prompt: "You need the fewest coins for every amount up to 10,000, with coins 1, 3, and 4. Which approach gives correct answers efficiently?"
    options:
      - "Greedy, always taking the largest coin that fits"
      - "A min-heap of coins, popping the smallest each time"
      - "Try every combination of coins recursively, without caching"
      - "A table of the fewest coins for each amount from 0 up"
    answer: 3
    explanations:
      correct: "dp[a] = 1 + the minimum of dp[a - c] over the coins c, with dp[0] = 0, is correct for any coin system and costs O(amount x number of coins)."
      wrong:
        0: "Greedy fails for this coin system: for 6 it takes 4 + 1 + 1 instead of 3 + 3."
        1: "Taking the smallest coin first uses the most coins, not the fewest: 6 would become six 1s."
        2: "Plain recursion finds the right answer, but it recomputes the same amounts an exponential number of times; a table removes the repetition."
