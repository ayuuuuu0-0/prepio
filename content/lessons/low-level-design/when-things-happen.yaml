slug: when-things-happen
title: "When Things Happen"
node: when-things-happen
kind: lesson
status: published
difficulty: medium
est_minutes: 5
skills:
  - { skill: lld-patterns, weight: 1.0 }
summary:
  - "The observer pattern lets a publisher announce an event without knowing who reacts to it."
  - "New reactions subscribe themselves, so adding one never edits the publisher."
  - "The cost is a less visible flow, so name events clearly and make subscribers easy to find."
steps:
  - id: intro
    type: intro
    beats:
      - { text: "Placing an order triggers email, analytics, and inventory updates.", emphasis: "triggers", visual: flow, durationMs: 4500 }
      - { text: "If the order code calls each one directly, every new reaction means editing it.", emphasis: "editing it", visual: bars, durationMs: 4500 }
      - { text: "Publish one event, and let any number of listeners react.", emphasis: "any number of listeners", visual: pulse, durationMs: 4500 }
  - id: decouple
    type: mcq
    prompt: "After saving an order, OrderService calls EmailService, AnalyticsService, and InventoryService directly. A fourth team wants to react to new orders. Which design lets them do that without changing OrderService?"
    options:
      - "Have each team poll the orders table every few seconds"
      - "OrderService publishes an OrderPlaced event that listeners subscribe to"
      - "Make OrderService extend each service class"
    answer: 1
    explanations:
      correct: "With the observer pattern, OrderService only announces that an order was placed. New reactions subscribe themselves, and OrderService never learns their names."
      wrong:
        0: "Polling can work, but it adds delay and load, and every team ends up rebuilding change detection on the same table."
        2: "Most languages allow only one parent class, and inheritance would couple OrderService even more tightly to each service."
  - id: observer-notify
    type: code_snippet
    prompt: "Implement `subscribe` and `notify` on `OrderEventEmitter`: append the listener to `this.listeners` in `subscribe`, and iterate through `this.listeners` calling `onOrderPlaced(order)` on each in `notify`."
    language: typescript
    starter: |
      interface OrderListener {
        onOrderPlaced(order: Order): void;
      }

      class OrderEventEmitter {
        private listeners: OrderListener[] = [];

        subscribe(listener: OrderListener): void {
          // TODO: append listener to this.listeners
        }

        notify(order: Order): void {
          // TODO: dispatch onOrderPlaced(order) to every listener
        }
      }
    solution: |
      interface OrderListener {
        onOrderPlaced(order: Order): void;
      }

      class OrderEventEmitter {
        private listeners: OrderListener[] = [];

        subscribe(listener: OrderListener): void {
          this.listeners.push(listener);
        }

        notify(order: Order): void {
          for (const listener of this.listeners) {
            listener.onOrderPlaced(order);
          }
        }
      }
    tests:
      - name: "Appends listener to list in subscribe"
        type: contains
        value: "this.listeners.push(listener)"
      - name: "Invokes onOrderPlaced on listeners"
        type: contains
        value: "onOrderPlaced(order)"
      - name: "Iterates over internal listeners list"
        type: contains
        value: "this.listeners"
      - name: "Preserves class structure and method order"
        type: structure
        values:
          - "subscribe"
          - "this.listeners.push"
          - "notify"
          - "onOrderPlaced"
    explanation: "The publisher holds a collection of subscribers conforming to OrderListener. subscribe adds to the collection, and notify broadcasts the event to each registered listener without coupling to concrete subscriber implementations."
  - id: event-flow
    type: arrange
    prompt: "Order what happens when an order is placed using the observer pattern."
    items:
      - "OrderService publishes OrderPlaced"
      - "Each listener handles the event in its own way"
      - "Email and inventory listeners subscribe at startup"
      - "OrderService saves the order"
    order: [2, 3, 0, 1]
    explanation: "Listeners register before anything happens; the publisher saves the order, then announces the event; each listener reacts independently, without knowing about the others."
  - id: tracing-cost
    type: true_false
    statement: "One cost of events is that following the full flow means finding every subscriber, not just reading one method."
    answer: true
    explanation: "Decoupling hides who reacts. Clear event names, an easy way to list subscribers, and logging on events keep the flow discoverable."
