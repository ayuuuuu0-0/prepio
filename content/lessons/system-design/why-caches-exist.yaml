slug: why-caches-exist
title: "Why Caches Exist"
node: why-caches-exist
kind: lesson
status: published
difficulty: easy
est_minutes: 4
skills:
  - { skill: system-design-scaling, weight: 1.0 }
summary:
  - "A cache keeps a fast copy of frequently read data, so most requests never reach the database."
  - "Caching trades freshness for speed: cached data can be stale until it expires or is invalidated."
  - "Cache-aside: check the cache first; on a miss, load from the database and store the result."
  - "Cache data that is read often and changes rarely; read must-be-current data from the source of truth."
steps:
  - id: intro
    type: intro
    beats:
      - { text: "Reading from a database is slow. Reading from memory is fast.", emphasis: "memory", visual: bars, durationMs: 4000 }
      - { text: "A cache keeps a copy of hot data close by, so most requests never reach the database.", emphasis: "hot data", visual: flow, durationMs: 5000 }
      - { text: "The trade-off: the copy can go stale. Every cache design is a bet on that.", emphasis: "stale", visual: pulse, durationMs: 4500 }
  - id: read-heavy
    type: mcq
    prompt: "A product page is read 10,000 times for every time it is edited. Which change reduces database load the most?"
    options:
      - "Add a cache in front of the database for product reads"
      - "Add an index on the product price column"
      - "Move the product table to a bigger disk"
    answer: 0
    explanations:
      correct: "Read-heavy, rarely changing data is the ideal cache candidate: most reads are served from memory and never touch the database."
      wrong:
        1: "An index speeds up lookups by price, but every read still reaches the database, so the load barely changes."
        2: "A bigger disk adds capacity, not speed. Each read still goes to the database."
  - id: stale-reads
    type: true_false
    statement: "A cache holds a product's price and an admin changes the price in the database. Users see the new price immediately, even before the cached entry expires."
    answer: false
    explanation: "The cache keeps returning its stored copy until it expires or is invalidated, so users can see the old price. Choosing a TTL is choosing how stale is acceptable."
  - id: cache-aside
    type: mcq
    prompt: "In the cache-aside pattern, what does the application do on a cache miss?"
    options:
      - "Return an empty response and let the cache fill itself in the background"
      - "Write to the cache and the database at the same time"
      - "Read from the database, then store the result in the cache"
    answer: 2
    explanations:
      correct: "In cache-aside the application checks the cache first. On a miss it loads from the source of truth and populates the cache for the next request."
      wrong:
        0: "A cache does not fill itself. If the application returned empty on every miss, cold or evicted keys would look like missing data."
        1: "That describes write-through, which happens on writes. A read miss is handled by loading from the database."
  - id: poor-fit
    type: mcq
    prompt: "Which data is a poor fit for caching?"
    options:
      - "A blog post that changes once a month"
      - "An account balance that must always be exactly current"
      - "A product image requested on every page view"
    answer: 1
    explanations:
      correct: "Data that must always be exactly current cannot tolerate stale reads. Read it from the source of truth."
      wrong:
        0: "Content that is read often and changes rarely is exactly what caches handle best."
        2: "Static assets that are requested constantly are classic cache candidates, often served from a CDN."
